<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сторінку не знайдено · Вʼячеслав Муністер</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#0b0b0c">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">

<script>
// GitHub Pages serves this file for every unmatched path on the whole domain,
// so the SPA redirect below must stay scoped to the apps that actually need it.
// Anything else falls through to the real 404 page.
(function () {
  var SPA_ROOTS = ['fob'];
  var l = window.location;
  var segments = l.pathname.split('/');
  var root = segments[1];

  if (SPA_ROOTS.indexOf(root) === -1) return;

  // /fob/contacts -> /fob/?p=/contacts ; fob/index.html restores the route.
  var route = '/' + segments.slice(2).join('/');
  l.replace(
    l.protocol + '//' + l.host + '/' + root + '/?p=' + encodeURIComponent(route) +
    (l.search ? '&q=' + encodeURIComponent(l.search.slice(1)) : '') +
    l.hash
  );
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Onest:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Onest:wght@400;500;600&display=swap"></noscript>

<style>
:root{--bg:#fff;--fg:#0b0b0c;--muted:#6b7280;--line:#ececef;--card:#f5f5f7;--radius:24px}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--fg);line-height:1.5;
  font-family:Onest,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100dvh;display:grid;place-items:center;padding:32px 20px;
}
.box{width:100%;max-width:560px}
.code{
  font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:600;
  font-size:clamp(64px,16vw,132px);line-height:.9;letter-spacing:-.02em;
}
h1{font-size:clamp(21px,4.4vw,28px);font-weight:600;letter-spacing:-.01em;margin:18px 0 10px}
p.lead{color:var(--muted);font-size:16px;max-width:44ch}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--line);background:var(--card);border-radius:999px;
  padding:9px 15px;font-size:14px;font-weight:500;color:var(--fg);text-decoration:none;
  transition:background .18s ease,border-color .18s ease;
}
.chip:hover{background:#ececef;border-color:#dcdce0}
.chip.solid{background:#0b0b0c;color:#fff;border-color:#0b0b0c}
.chip.solid:hover{background:#26262a;border-color:#26262a}
.path{
  margin-top:22px;font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:12.5px;color:var(--muted);word-break:break-all;
}
.foot{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.foot a{color:var(--muted)}
@media (prefers-color-scheme:dark){
  :root{--bg:#0b0b0c;--fg:#f5f5f7;--muted:#9aa0a6;--line:#232327;--card:#141416}
  .chip:hover{background:#1c1c1f;border-color:#2e2e33}
  .chip.solid{background:#f5f5f7;color:#0b0b0c;border-color:#f5f5f7}
  .chip.solid:hover{background:#e2e2e6;border-color:#e2e2e6}
}
</style>
</head>
<body>
<div class="box">
  <div class="code">404</div>
  <h1 data-i18n="t">Такої сторінки немає</h1>
  <p class="lead" data-i18n="d">Можливо, адресу набрано з помилкою або матеріал переїхав. Ось із чого можна почати.</p>

  <div class="links">
    <a class="chip solid" href="/" data-i18n="home">На головну</a>
    <a class="chip" href="/cv.html" data-i18n="cv">Резюме</a>
    <a class="chip" href="https://agency.munister.com.ua/" data-i18n="agency">Munister Agency</a>
    <a class="chip" href="mailto:munister@outlook.com" data-i18n="mail">Написати</a>
  </div>

  <p class="path" id="path"></p>

  <p class="foot">
    <span data-i18n="lost">Гадаєте, це помилка на сайті?</span>
    <a href="mailto:munister@outlook.com?subject=404%20on%20munister.com.ua" data-i18n="tell">Повідомте мені</a>.
  </p>
</div>

<script>
(function () {
  var EN = {
    t: "This page doesn’t exist",
    d: "The address may be mistyped, or the page has moved. Here’s where to pick up.",
    home: "Home", cv: "CV", agency: "Munister Agency", mail: "Email me",
    lost: "Think this is a broken link?", tell: "Tell me"
  };

  var el = document.getElementById('path');
  if (el) el.textContent = location.pathname + location.search;

  var saved = null;
  try { saved = localStorage.getItem('munister-lang'); } catch (e) {}
  // Matches the homepage: anything that is not exactly "uk" is treated as English.
  var isEn = saved !== 'uk';
  if (!isEn) return;

  document.documentElement.lang = 'en';
  document.title = "Page not found · Viacheslav Munister";
  document.querySelectorAll('[data-i18n]').forEach(function (node) {
    var v = EN[node.dataset.i18n];
    if (v !== undefined) node.textContent = v;
  });
})();
</script>
</body>
</html>
