<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Schemata — Oracle data modeler</title>
  <meta name="description" content="Schemata: open-source browser data modeler for Oracle Database. ER diagrams, DDL generation and DDL import.">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light only">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%236366f1'/><stop offset='1' stop-color='%238b5cf6'/></linearGradient></defs><rect width='32' height='32' rx='8' fill='url(%23g)'/><rect x='6' y='7' width='9' height='8' rx='2' fill='white'/><rect x='17' y='17' width='9' height='8' rx='2' fill='white' fill-opacity='.85'/><path d='M15 11h3.5a1.5 1.5 0 0 1 1.5 1.5V17' fill='none' stroke='white' stroke-width='1.6'/></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true"><svg viewBox="0 0 32 32"><rect x="6" y="7" width="9" height="8" rx="2" fill="#fff"/><rect x="17" y="17" width="9" height="8" rx="2" fill="#fff" fill-opacity=".85"/><path d="M15 11h3.5a1.5 1.5 0 0 1 1.5 1.5V17" fill="none" stroke="#fff" stroke-width="1.6"/></svg></span>
      <span class="brand-name">Schemata</span>
      <span class="crumb-sep">/</span>
      <input id="model-name" class="model-name" spellcheck="false" data-i18n-label="model.name.t">
      <span class="saved" id="saved"><i></i><span data-i18n="st.saved"></span></span>
    </div>

    <button class="cmdk" data-action="palette">
      <svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
      <span data-i18n="cmd.open"></span>
      <kbd>⌘K</kbd>
    </button>

    <div class="top-end">
      <div class="btn-group">
        <button class="tb" data-action="new" data-i18n-title="tb.new.t"><svg viewBox="0 0 16 16"><path d="M4 1.75h5.25L12.5 5v9.25H4z M9 1.75V5.25h3.5"/></svg></button>
        <button class="tb" data-action="open" data-i18n-title="tb.open.t"><svg viewBox="0 0 16 16"><path d="M1.75 4.25v8.5h12.5v-7H7.5L6 4.25z"/></svg></button>
        <button class="tb" data-action="save" data-i18n-title="tb.save.t"><svg viewBox="0 0 16 16"><path d="M8 2.5v7.5M5 7l3 3 3-3M2.75 13.25h10.5"/></svg></button>
      </div>
      <div class="btn-group">
        <button class="tb text" data-action="import" data-i18n-title="tb.import.t"><svg viewBox="0 0 16 16"><path d="M8 10V2.5M5 5.5l3-3 3 3M2.75 13.25h10.5"/></svg><span data-i18n="tb.import"></span></button>
        <button class="tb text" data-action="svg" data-i18n-title="tb.svg.t"><svg viewBox="0 0 16 16"><rect x="2" y="2.5" width="12" height="11" rx="2"/><path d="M2.5 11l3.5-3 2.5 2 2-1.5 3 2.5"/></svg><span data-i18n="tb.svg"></span></button>
      </div>
      <div class="lang" role="group" aria-label="Language"><button data-lang="uk">UK</button><button data-lang="en">EN</button></div>
      <button class="primary" data-action="ddl" data-i18n-title="tb.ddl.t"><svg viewBox="0 0 16 16"><path d="M5.5 4.5L2 8l3.5 3.5M10.5 4.5L14 8l-3.5 3.5"/></svg><span>Oracle DDL</span></button>
    </div>
  </header>

  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="stage">
      <svg id="canvas" data-i18n-label="canvas.label"></svg>
      <div class="mode-hint" id="mode-hint" hidden><span class="pulse"></span><span id="mode-hint-text"></span><kbd>esc</kbd></div>

      <div class="dock" role="toolbar">
        <button data-action="select" data-i18n-title="tb.select.t" class="on"><svg viewBox="0 0 16 16"><path d="M3.5 2.5l9 5.2-4 .9-2 3.9z"/></svg></button>
        <button data-action="table" data-i18n-title="tb.table.t"><svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="10" rx="2"/><path d="M2 6.75h12M6.5 6.75V13"/></svg></button>
        <button data-action="relation" data-i18n-title="tb.relation.t"><svg viewBox="0 0 16 16"><circle cx="3.5" cy="12.5" r="1.75"/><circle cx="12.5" cy="3.5" r="1.75"/><path d="M5 11l6-6"/></svg></button>
        <i></i>
        <button data-action="layout" data-i18n-title="tb.layout.t"><svg viewBox="0 0 16 16"><rect x="2" y="2" width="5" height="5" rx="1.2"/><rect x="9" y="2" width="5" height="5" rx="1.2"/><rect x="9" y="9" width="5" height="5" rx="1.2"/><path d="M7 4.5h2M11.5 7v2"/></svg></button>
        <button data-action="fit" data-i18n-title="tb.fit.t"><svg viewBox="0 0 16 16"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></svg></button>
        <i></i>
        <button data-action="undo" data-i18n-title="tb.undo.t"><svg viewBox="0 0 16 16"><path d="M5.5 3L2.5 6l3 3M2.5 6H10a3.5 3.5 0 010 7H7"/></svg></button>
        <button data-action="redo" data-i18n-title="tb.redo.t"><svg viewBox="0 0 16 16"><path d="M10.5 3l3 3-3 3M13.5 6H6a3.5 3.5 0 000 7h3"/></svg></button>
      </div>

      <div class="nav-card">
        <svg id="minimap" data-i18n-label="mm.label"></svg>
        <div class="zoom">
          <button data-action="zoom-out" data-i18n-title="tb.zoomOut.t"><svg viewBox="0 0 16 16"><path d="M3.5 8h9"/></svg></button>
          <button id="zoom" data-action="zoom-reset">100%</button>
          <button data-action="zoom-in" data-i18n-title="tb.zoomIn.t"><svg viewBox="0 0 16 16"><path d="M3.5 8h9M8 3.5v9"/></svg></button>
        </div>
      </div>
    </main>

    <aside id="panel" class="panel"></aside>
  </div>

  <dialog id="ddl-dialog">
    <form method="dialog">
      <header>
        <span class="dlg-ic"><svg viewBox="0 0 16 16"><path d="M5.5 4.5L2 8l3.5 3.5M10.5 4.5L14 8l-3.5 3.5"/></svg></span>
        <div><h2 data-i18n="ddl.title"></h2><p class="sub">Oracle Database 19c · 23ai</p></div>
        <button value="close" class="ic" data-i18n-title="close"><svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
      </header>
      <div class="opts">
        <label class="switch"><input type="checkbox" id="opt-comments" checked><span></span><b data-i18n="ddl.comments"></b></label>
        <label class="switch"><input type="checkbox" id="opt-drop"><span></span><b data-i18n="ddl.drop"></b></label>
      </div>
      <pre class="code" id="ddl-code"></pre>
      <textarea id="ddl-out" hidden></textarea>
      <footer><button class="secondary" id="ddl-copy" data-i18n="ddl.copy"></button><button class="primary" id="ddl-download" data-i18n="ddl.download"></button></footer>
    </form>
  </dialog>

  <dialog id="import-dialog">
    <form method="dialog">
      <header>
        <span class="dlg-ic"><svg viewBox="0 0 16 16"><path d="M8 10V2.5M5 5.5l3-3 3 3M2.75 13.25h10.5"/></svg></span>
        <div><h2 data-i18n="imp.title"></h2><p class="sub" data-i18n="imp.desc"></p></div>
        <button value="close" class="ic" data-i18n-title="close"><svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
      </header>
      <textarea id="import-text" class="code-input" spellcheck="false" placeholder="CREATE TABLE …"></textarea>
      <div id="import-log"></div>
      <footer>
        <label class="switch"><input type="checkbox" id="import-replace"><span></span><b data-i18n="imp.replace"></b></label>
        <button class="secondary" id="import-file" type="button" data-i18n="imp.file"></button>
        <button class="secondary" type="button" data-action="sample" data-i18n="imp.sample"></button>
        <button class="primary" id="import-run" data-i18n="imp.run"></button>
      </footer>
    </form>
  </dialog>

  <div id="toast" role="status"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
