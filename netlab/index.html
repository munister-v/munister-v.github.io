<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NetLab — робочий стіл викладача комп'ютерних мереж</title>
<meta name="description" content="Калькулятор підмереж і VLSM, тренажер з адресації, конструктор схем мережі, ігри за моделлю OSI та портами, друковані завдання з ключем.">
<meta name="theme-color" content="#CDF940">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles/netlab.css?v=4">
<link rel="stylesheet" href="styles/os.css?v=4">
</head>
<body class="os">

<div id="menubar">
  <span class="wordmark">Net<span>Lab</span></span>
  <button class="mb-item" data-menu="menu-tools">Інструменти</button>
  <button class="mb-item" data-menu="menu-class">Група</button>
  <span class="spacer"></span>
  <span class="mb-meta" id="mb-who"></span>
  <span class="mb-clock" id="mb-clock"></span>
</div>

<div class="mb-menu" id="menu-tools"></div>
<div class="mb-menu" id="menu-class"></div>

<div id="desktop"></div>

<div id="dock-wrap"><div id="dock"></div></div>
<div id="toast"></div>

<script src="js/os.js?v=4"></script>
<script src="js/api.js?v=4"></script>
<script>
// Меню збираються з того самого реєстру застосунків, що й іконки столу:
// новий інструмент з'являється всюди одразу, забути щось неможливо.
function buildMenu(id, ids) {
  document.getElementById(id).innerHTML = ids.map(x =>
    x === "|" ? '<div class="sep"></div>'
      : `<button data-open="${x}">${OS.svg(OS.APPS[x].icon)}<span>${OS.APPS[x].title}</span></button>`).join("");
}
buildMenu("menu-tools", ["subnet", "trainer", "ipv6", "routing", "|", "topology", "|", "cases", "osi", "ports", "cables", "|", "handouts", "cheatsheet"]);
buildMenu("menu-class", ["account", "join"]);

OS.boot();

// Хто зараз у системі — видно в смузі меню, як і в TeachEd.
(function showWho() {
  const w = API.who();
  if (!w) return;
  document.getElementById("mb-who").textContent =
    (w.kind === "teacher" ? "викладач · " : "студент · ") + (w.name || "");
})();
</script>
</body>
</html>
