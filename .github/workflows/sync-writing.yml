name: Sync Writing page from EPRIS Journal

# CORS on api.eprisjournal.com only allows eprisjournal.com itself, so a
# client-side fetch from munister.com.ua would be blocked in the browser -
# this has to run server-side, on a schedule, and commit the regenerated
# static HTML instead. See scripts/sync-writing.mjs for the actual logic.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  # A push made with the default GITHUB_TOKEN does not fire other workflows'
  # `on: push` triggers - GitHub's own loop guard. That silently meant this
  # job's commits never reached Deploy GitHub Pages: the sync ran on schedule,
  # wrote the file, committed and pushed successfully every time, and the
  # site kept showing whatever a human's own push had last deployed. Calling
  # the deploy explicitly below is the fix, and needs actions: write to do it.
  actions: write

concurrency:
  group: sync-writing
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync writing/index.html from the live EPRIS content API
        run: node scripts/sync-writing.mjs

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- writing/index.html; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "munister-writing-sync[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add writing/index.html
          git commit -m "writing: sync articles from EPRIS Journal [auto]"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy the updated page
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
