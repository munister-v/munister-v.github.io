<style>
/* Бриф набран по правилам сайта: белая бумага, чернила, волосяные линейки,
   мелкие разряженные капители в служебных строках. Единственный цвет на
   странице — специмен работы, то есть макет карточки книги. Классы с
   префиксом b- , чтобы ничего не отобрать у munister.css. */

/* ── липкая полоса прогресса ────────────────────────────── */
.b-bar{position:sticky;top:var(--bar);z-index:20;background:rgba(255,255,255,.94);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--c-rule);margin-bottom:clamp(1.6rem,3vw,2.6rem)}
.b-bar-in{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:9px 0}
.b-track{flex:1 1 150px;min-width:110px;height:2px;background:var(--c-rule)}
.b-track i{display:block;height:100%;width:0;background:var(--c-ink);transition:width .3s ease}
.b-stat{white-space:nowrap}
.b-stat b{color:var(--c-ink);font-weight:400;font-variant-numeric:tabular-nums}
@media (max-width:620px){
  .b-track{flex:1 1 56px;min-width:44px}
  .b-stat{font-size:9px;letter-spacing:.14em}
  .b-bar-in{gap:10px;padding:7px 0}
}

/* ── раздел ─────────────────────────────────────────────── */
.b-sec{padding-top:clamp(2rem,4vw,3.4rem)}
.b-sec-head{padding-bottom:14px;border-bottom:1px solid var(--c-ink)}
.b-sec-head h2{font-family:var(--font-display);font-size:clamp(30px,3.6vw,50px);line-height:.96;letter-spacing:-.04em}

/* ── вопрос ─────────────────────────────────────────────── */
.b-q{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr);gap:clamp(18px,4vw,54px);
  padding:clamp(22px,3vw,34px) 0;border-bottom:1px solid var(--c-rule)}
.b-ask{position:relative}
.b-num{margin-bottom:10px}
.b-q h3{font-family:var(--font-head);font-size:clamp(21px,2.3vw,28px);line-height:1.1;letter-spacing:-.012em}
.b-hint{margin-top:12px;color:var(--c-muted);font-size:14.5px;line-height:1.5;max-width:44ch}
.b-ex{margin-top:12px;font-family:var(--font-head);font-style:italic;font-size:14.5px;line-height:1.45;
  color:var(--c-faint);max-width:44ch;white-space:pre-wrap}
/* Списки на десяток пунктов и карточки-специмены задыхаются в правой
   колонке: вопрос уезжает наверх, ответы получают всю ширину. */
.b-q--wide{grid-template-columns:1fr;gap:18px}
.b-q--wide .b-ask{max-width:64ch}
@media (max-width:860px){.b-q{grid-template-columns:1fr;gap:16px}}

/* ── варианты: настоящие чекбоксы, без рамок и заливок ──── */
.b-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:0 30px}
.b-q--wide .b-opts{grid-template-columns:repeat(auto-fit,minmax(min(100%,265px),1fr))}
.b-opts.b-one{grid-template-columns:1fr}
.b-opt{display:flex;align-items:flex-start;gap:11px;padding:7px 0;cursor:pointer;
  font-size:15.5px;line-height:1.4;letter-spacing:-.004em}
.b-chk{appearance:none;-webkit-appearance:none;flex:0 0 auto;width:15px;height:15px;margin:4px 0 0;
  border:1px solid var(--c-rule-strong);background:var(--c-paper);cursor:pointer;position:relative}
.b-chk:checked{background:var(--c-ink);border-color:var(--c-ink)}
.b-chk:checked::after{content:"";position:absolute;left:4.5px;top:1px;width:4px;height:8px;
  border:solid var(--c-paper);border-width:0 1.5px 1.5px 0;transform:rotate(43deg)}
.b-chk:focus-visible{outline:2px solid var(--c-ink);outline-offset:2px}

/* ── фокус: свои контролы не наследуют стили сайта ───────── */
.b-q textarea:focus-visible{outline:2px solid var(--c-ink);outline-offset:2px}

/* ── текст ──────────────────────────────────────────────── */
.b-q textarea{width:100%;font-family:var(--font-body);font-size:16px;line-height:1.5;color:var(--c-ink);
  background:var(--c-paper);border:1px solid var(--c-rule);padding:13px 15px;resize:vertical;
  letter-spacing:-.004em}
.b-q textarea:focus{outline:none;border-color:var(--c-ink)}
.b-q textarea::placeholder{color:var(--c-faint);font-family:var(--font-head);font-style:italic}

/* ── каркасы сайта ──────────────────────────────────────── */
.b-frames{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:700px){.b-frames{grid-template-columns:repeat(3,minmax(0,1fr))}}
.b-frame{border:1px solid var(--c-rule);padding:15px 17px 17px;display:flex;flex-direction:column;gap:10px;
  cursor:pointer;transition:border-color .18s ease}
.b-frame:hover{border-color:var(--c-rule-strong)}
.b-frame.is-on{border-color:var(--c-ink)}
.b-frame .b-top{display:flex;align-items:flex-start;gap:11px}
.b-frame b{font-family:var(--font-head);font-weight:400;font-size:20px;line-height:1.1}
.b-frame pre{margin:0;font-family:var(--font-mono);font-size:11.5px;line-height:1.75;
  letter-spacing:0;text-transform:none;color:var(--c-muted);white-space:pre;overflow-x:auto}
.b-frame .b-cost{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.1em;color:var(--c-faint)}

/* ── финал ──────────────────────────────────────────────── */
.b-fin{background:var(--c-ink);color:var(--c-paper);padding:clamp(26px,4vw,48px);
  margin-top:clamp(2.4rem,5vw,4.4rem)}
.b-fin h2{font-family:var(--font-display);font-size:clamp(28px,3.4vw,46px);line-height:.98;letter-spacing:-.04em}
.b-fin .mono{color:rgba(255,255,255,.55)}
.b-fin p{margin-top:16px;max-width:52ch;color:rgba(255,255,255,.76);font-size:16px}
.b-acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.b-fin .btn{border-color:rgba(255,255,255,.4);color:var(--c-paper)}
.b-fin .btn:hover{background:var(--c-paper);border-color:var(--c-paper);color:var(--c-ink)}
.b-fin .btn--solid{background:var(--c-paper);border-color:var(--c-paper);color:var(--c-ink)}
.b-fin .btn--solid:hover{background:#e6e4e0;border-color:#e6e4e0;color:var(--c-ink)}
.b-said{margin-top:18px;font-size:15px;line-height:1.5;color:rgba(255,255,255,.9);max-width:52ch}
.b-out{margin-top:18px;white-space:pre-wrap;font-family:var(--font-mono);font-size:12px;line-height:1.7;
  letter-spacing:0;text-transform:none;color:rgba(255,255,255,.82);background:#1d1d1d;
  border:1px solid rgba(255,255,255,.18);padding:16px 18px;max-height:360px;overflow:auto}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms !important}}
@media print{.b-bar,.b-acts,.site-head{display:none}.b-fin{background:#fff;color:#000}
  .b-fin h2,.b-fin p{color:#000}.b-q{break-inside:avoid}}
</style>

      {id:"works", type:"multitext", q:"Що у ваших каналах уже працює візуально",
       hint:"Сайт продовжує те, що аудиторія вже впізнає у стрічці.",
       opts:["Чорно-білі портрети","Знімки на плівку","Темна щільна стрічка","Кадри з книгою в руках","Рукописний підпис і леттерінг","Відео та рілси","Карусель із цитатами","Символи й сигіли"],
       ex:"Чорно-білі портрети, темна стрічка, плівка, кадри з книгою в руках.",
       ph:"Що впізнають:\nЩо залітає найкраще:\nЩо я більше не використовую:"},
      {id:"limits", type:"multi", q:"Чого немає і не буде до запуску",
       hint:"Обмеження визначають стратегію: без фотографій сайт тримається типографікою.",
       ex:"Немає зйомки й ілюстратора.",
       opts:["Предметної зйомки книг","Ілюстратора","Логотипа у векторі","Фото засновників","Відео","Текстів про книги","Бюджету на фотосесію","Усе перелічене або буде, або вже є"]},
      {id:"occult", type:"multi", q:"Скільки езотеричної символіки",
       hint:"Межу ставите ви, ми тримаємо її в усіх компонентах — від шапки до сторінки 404.",
       ex:"«Один знак» → сигіл у шапці й на 404.",
       opts:["Один знак — і той стримано","Символіка в дрібних деталях: лінії, позначки розділів","Повноцінна мова знаків: сигіли, фази, карти","Жодної: тільки книги й типографіка"]}
    ]},

    { id:"s5", num:"04", title:"Матеріали й межі", qs:[
      {id:"assets", type:"multi", q:"Що можна передати зараз",
       hint:"Те, що можна передати зараз. Чого бракує — закладаємо в роботу окремо.",
       ex:"Логотип і фото книг є, текстів немає.",
       opts:["Логотип у векторі","Фірмові кольори або гайдлайн","Фото книг","Макети обкладинок","Текст про видавництво","Анотації книг","Фото засновників","Домен","Відгуки читачів","Нічого — робимо з нуля"]},
      {id:"no", type:"text", q:"Референси й антиреференси",
       hint:"Найкорисніше питання анкети: воно економить тижні правок.",
       ex:"Не треба: стокових кристалів, попапів зі скидкою, вигляду звичайного інтернет-магазину.",
       ph:"Подобається:\nhttps://…  — чим саме\n\nНе треба:\n"}
    ]}
  ];

  var KEY = "vidmar-brief-v4";
  var A = {};
  try { var raw = localStorage.getItem(KEY); if(raw) A = JSON.parse(raw) || {}; } catch(e){ A = {}; }

  var savedEl = document.getElementById("saved");
  var saveTimer = null;
  function save(){
    try{
      localStorage.setItem(KEY, JSON.stringify(A));
      savedEl.textContent = "збережено";
      clearTimeout(saveTimer);
      saveTimer = setTimeout(function(){ savedEl.textContent = ""; }, 1700);
    }catch(e){
      savedEl.textContent = "збереження недоступне";
    }
  }

  var ALL = [];
  SECTIONS.forEach(function(s){ s.qs.forEach(function(q){ ALL.push(q); }); });

  function arrOf(id){
    if(!Array.isArray(A[id])) A[id] = (A[id] === undefined || A[id] === null) ? [] : [A[id]];
    return A[id];
  }
  function pair(id){
    if(!A[id] || typeof A[id] !== "object" || Array.isArray(A[id])) A[id] = {l:[], t:""};
    if(!Array.isArray(A[id].l)) A[id].l = [];
    if(typeof A[id].t !== "string") A[id].t = "";
    return A[id];
  }
  function toggle(arr, value){
    var i = arr.indexOf(value);
    if(i > -1) arr.splice(i, 1); else arr.push(value);
  }

  function answered(q){
    var v = A[q.id];
    if(v === undefined || v === null) return false;
    if(q.type === "multi" || q.type === "frames") return Array.isArray(v) && v.length > 0;
    if(q.type === "multitext") return (Array.isArray(v.l) && v.l.length > 0) || (typeof v.t === "string" && v.t.trim().length > 0);
    if(q.type === "text") return String(v).trim().length > 0;
    return true;
  }
  function updateProgress(){
    var n = 0;
    ALL.forEach(function(q){ if(answered(q)) n++; });
    var pct = Math.round(n / ALL.length * 100);
    document.getElementById("fill").style.width = pct + "%";
    document.getElementById("track").setAttribute("aria-valuenow", String(pct));
    var c = document.getElementById("count");
    c.textContent = "";
    var strong = document.createElement("b");
    strong.textContent = String(n);
    c.appendChild(strong);
    c.appendChild(document.createTextNode(" / " + ALL.length));
  }

  function el(tag, cls, txt){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(txt !== undefined) e.textContent = txt;
    return e;
  }
  function checkbox(){
    var c = document.createElement("input");
    c.type = "checkbox";
    c.className = "b-chk";
    return c;
  }
  function repaintAll(box){
    Array.prototype.forEach.call(box.children, function(ch){ ch.dispatchEvent(new Event("repaint")); });
  }

  function renderQ(q, num){
    var wide = q.type === "frames" || (Array.isArray(q.opts) && q.opts.length >= 9);
    var card = el("article", "b-q" + (wide ? " b-q--wide" : ""));
    card.id = "q-" + q.id;

    var ask = el("div", "b-ask");
    var nu = el("p", "b-num mono");
    nu.appendChild(el("i"));
    nu.appendChild(document.createTextNode(String(num).padStart(2, "0")));
    ask.appendChild(nu);
    var title = el("h3", null, q.q);
    title.id = "qt-" + q.id;
    ask.appendChild(title);
    if(q.hint) ask.appendChild(el("p", "b-hint", q.hint));
    if(q.ex) ask.appendChild(el("p", "b-ex", q.ex));
    card.appendChild(ask);

    var body = el("div", "b-answer");
    card.appendChild(body);

    function mark(){
      card.classList.toggle("is-done", answered(q));
      updateProgress();
      save();
    }

    if(q.type === "multi" || q.type === "multitext"){
      var arr = q.type === "multi" ? arrOf(q.id) : pair(q.id).l;
      var longest = 0;
      q.opts.forEach(function(o){ longest = Math.max(longest, o.length); });
      var box = el("div", "b-opts" + (!wide && longest > 28 ? " b-one" : ""));
      box.setAttribute("role", "group");
      box.setAttribute("aria-labelledby", "qt-" + q.id);
      q.opts.forEach(function(o){
        var lab = el("label", "b-opt");
        var c = checkbox();
        c.checked = arr.indexOf(o) > -1;
        lab.appendChild(c);
        lab.appendChild(el("span", null, o));
        c.addEventListener("change", function(){
          toggle(arr, o);
          mark();
        });
        box.appendChild(lab);
      });
      body.appendChild(box);

      if(q.type === "multitext"){
        var extra = document.createElement("textarea");
        extra.rows = (q.ph && q.ph.split("\n").length > 3) ? 5 : 3;
        extra.id = "in-" + q.id;
        extra.placeholder = q.ph || "";
        extra.setAttribute("aria-label", q.q + " — деталі");
        extra.value = pair(q.id).t;
        extra.style.marginTop = "14px";
        extra.addEventListener("input", function(){ pair(q.id).t = extra.value; mark(); });
        body.appendChild(extra);
      }
    }

    if(q.type === "text"){
      var ta = document.createElement("textarea");
      ta.rows = (q.ph && q.ph.split("\n").length > 3) ? 6 : 4;
      ta.id = "in-" + q.id;
      ta.placeholder = q.ph || "";
      ta.setAttribute("aria-label", q.q);
      ta.value = A[q.id] || "";
      ta.addEventListener("input", function(){ A[q.id] = ta.value; mark(); });
      body.appendChild(ta);
    }

    if(q.type === "frames"){
      var fg = el("div", "b-frames");
      fg.setAttribute("role", "group");
      fg.setAttribute("aria-labelledby", "qt-" + q.id);
      var fcards = [];
      FRAMES.forEach(function(fr){
        var lab = el("label", "b-frame");
        var top = el("div", "b-top");
        var c = checkbox();
        top.appendChild(c);
        top.appendChild(el("b", null, fr.nm));
        lab.appendChild(top);
        lab.appendChild(el("pre", null, fr.tree));
        lab.appendChild(el("div", "b-cost", fr.cost));
        lab.chk = c; lab.value = fr.nm;
        fcards.push(lab);
        fg.appendChild(lab);
      });
      function paintFrames(){
        var picked = arrOf("frame");
        fcards.forEach(function(card){
          var on = picked.indexOf(card.value) > -1;
          card.chk.checked = on;
          card.classList.toggle("is-on", on);
        });
      }
      paintFrames();
      fcards.forEach(function(card){
        card.chk.addEventListener("change", function(){
          toggle(arrOf("frame"), card.value);
          paintFrames(); mark();
        });
      });
      body.appendChild(fg);
    }

    card.classList.toggle("is-done", answered(q));
    return card;
  }

  var form = document.getElementById("form");
  var n = 0;
  SECTIONS.forEach(function(s){
    var sec = el("section", "b-sec");
    sec.id = s.id;
    var head = el("div", "b-sec-head");
    head.appendChild(el("h2", null, s.title));
    sec.appendChild(head);

    var list = el("div", "b-qs");
    s.qs.forEach(function(q){ n++; list.appendChild(renderQ(q, n)); });

    sec.appendChild(list);

    form.appendChild(sec);
  });

  updateProgress();
  savedEl.textContent = "";

  function buildText(){
    var L = [];
    L.push("БРИФ НА САЙТ — ВІДЬМАР");
    L.push("Заповнено: " + new Date().toLocaleDateString("uk-UA", {day:"numeric", month:"long", year:"numeric"}));
    L.push("Джерело: munister.com.ua/brief/vidmar/");
    L.push("");
    var i = 0;
    SECTIONS.forEach(function(s){
      L.push("=== " + s.title.toUpperCase() + " ===");
      s.qs.forEach(function(q){
        i++;
        var v = A[q.id], out;
        if(q.type === "multi" || q.type === "frames") out = (Array.isArray(v) && v.length) ? v.join(", ") : "—";
        else if(q.type === "multitext"){
          var parts = [];
          if(v && Array.isArray(v.l) && v.l.length) parts.push(v.l.join(", "));
          if(v && v.t && v.t.trim()) parts.push(v.t.trim().split("\n").join("\n    "));
          out = parts.length ? parts.join("\n    ") : "—";
        }
        else if(q.type === "text") out = (v && String(v).trim()) ? String(v).trim().split("\n").join("\n    ") : "—";
        else out = (v && String(v).trim()) ? String(v).trim() : "—";
        L.push(String(i).padStart(2, "0") + ". " + q.q);
        L.push("    " + out);
      });
      L.push("");
    });
    var done = 0;
    ALL.forEach(function(q){ if(answered(q)) done++; });
    L.push("Заповнено питань: " + done + " з " + ALL.length);
    return L.join("\n");
  }

  /* Ответ уходит в EPRIS Forms API — туда же, куда анкеты авторов журнала,
     и оттуда же приходит уведомление в телеграм. Публичный маршрут: анкета
     открыта по ссылке, ответы наружу сервис не отдаёт никогда. */
  var ENDPOINT = "https://api.eprisjournal.com/forms/public/vidmar/submit";

  function payload(){
    var answers = {};
    SECTIONS.forEach(function(sec){
      sec.qs.forEach(function(q){
        var v = A[q.id];
        if(q.type === "multi" || q.type === "frames"){
          answers[q.id] = Array.isArray(v) ? v : [];
        } else if(q.type === "multitext"){
          var box = (v && typeof v === "object") ? v : {l:[], t:""};
          answers[q.id] = Array.isArray(box.l) ? box.l : [];
          answers[q.id + "_note"] = box.t || "";
        } else {
          answers[q.id] = v || "";
        }
      });
    });
    return { website: "", answers: answers };
  }

  var out = document.getElementById("out");
  var said = document.getElementById("said");
  var sendBtn = document.getElementById("send");

  function say(text){ said.textContent = text; said.hidden = false; }

  sendBtn.addEventListener("click", function(){
    var answered = 0;
    ALL.forEach(function(q){ if(A[q.id] !== undefined) answered++; });
    sendBtn.disabled = true;
    sendBtn.textContent = "Надсилаємо…";
    out.hidden = true;
    said.hidden = true;

    fetch(ENDPOINT, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(payload())
    }).then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(data){ return {ok: r.ok, data: data}; });
    }).then(function(res){
      if(res.ok && res.data && res.data.ok){
        sendBtn.textContent = "Надіслано";
        say(res.data.thankYou || "Дякуємо, бриф у нас.");
        try{ localStorage.removeItem(KEY); }catch(e){}
        return;
      }
      throw new Error((res.data && res.data.error) || "не вийшло");
    }).catch(function(){
      // Отправка может не дойти — тогда ответы не должны пропасть вместе с ней.
      sendBtn.disabled = false;
      sendBtn.textContent = "Спробувати ще раз";
      say("Не вийшло надіслати. Скопіюйте текст нижче й надішліть нам у будь-який месенджер.");
      out.textContent = buildText();
      out.hidden = false;
      if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(out.textContent).catch(function(){});
    });
  });

  document.getElementById("reset").addEventListener("click", function(){
    if(!confirm("Очистити всі відповіді? Дію не можна скасувати.")) return;
    try{ localStorage.removeItem(KEY); }catch(e){}
    location.reload();
  });

  document.getElementById("y").textContent = new Date().getFullYear();

  // Шапка сайта и полоса прогресса обе липкие, а высота полосы зависит от
  // ширины экрана. Считаем отступ для якорей по факту, а не на глаз.
  var bar = document.querySelector(".b-bar");
  function syncAnchorOffset(){
    var h = bar ? bar.getBoundingClientRect().height : 0;
    var top = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--bar")) || 56;
    document.documentElement.style.scrollPaddingTop = Math.round(top + h + 12) + "px";
  }
  syncAnchorOffset();
  window.addEventListener("resize", syncAnchorOffset);
})();
</script>
