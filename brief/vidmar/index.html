<head>

<title>Бриф · ВІДЬМАР</title>
<meta name="description" content="Анкета перед розробкою сайту видавництва ВІДЬМАР: структура, шаблони, стани, візуальна система.">
<!-- Адресне посилання для замовника: у пошуку цій сторінці робити нічого. -->
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180">
<link rel="stylesheet" href="/munister.css?v=26">
<style>
/* Бриф набран по правилам сайта: белая бумага, чернила, волосяные линейки,
   мелкие разряженные капители в служебных строках. Единственный цвет на
   странице — специмен работы, то есть макет карточки книги. Классы с
   префиксом b- , чтобы ничего не отобрать у munister.css. */

/* ── липкая полоса прогресса ────────────────────────────── */
.b-bar{position:sticky;top:var(--bar);z-index:20;background:rgba(255,255,255,.94);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--c-rule);margin-bottom:clamp(1.6rem,3vw,2.6rem)}
.b-bar-in{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:9px 0}
.b-track{flex:1 1 150px;min-width:110px;height:2px;background:var(--c-rule)}
.b-track i{display:block;height:100%;width:0;background:var(--c-ink);transition:width .3s ease}
.b-stat{white-space:nowrap}
.b-stat b{color:var(--c-ink);font-weight:400;font-variant-numeric:tabular-nums}
@media (max-width:620px){
  .b-track{flex:1 1 56px;min-width:44px}
  .b-stat{font-size:9px;letter-spacing:.14em}
  .b-bar-in{gap:10px;padding:7px 0}
}

/* ── раздел ─────────────────────────────────────────────── */
.b-sec{padding-top:clamp(2rem,4vw,3.4rem)}
.b-sec-head{padding-bottom:14px;border-bottom:1px solid var(--c-ink)}
.b-sec-head h2{font-family:var(--font-display);font-size:clamp(30px,3.6vw,50px);line-height:.96;letter-spacing:-.04em}

/* ── вопрос ─────────────────────────────────────────────── */
.b-q{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr);gap:clamp(18px,4vw,54px);
  padding:clamp(22px,3vw,34px) 0;border-bottom:1px solid var(--c-rule)}
.b-ask{position:relative}
.b-num{margin-bottom:10px}
.b-q h3{font-family:var(--font-head);font-size:clamp(21px,2.3vw,28px);line-height:1.1;letter-spacing:-.012em}
.b-hint{margin-top:12px;color:var(--c-muted);font-size:14.5px;line-height:1.5;max-width:44ch}
.b-ex{margin-top:12px;font-family:var(--font-head);font-style:italic;font-size:14.5px;line-height:1.45;
  color:var(--c-faint);max-width:44ch;white-space:pre-wrap}
@media (max-width:860px){.b-q{grid-template-columns:1fr;gap:16px}}

/* ── варианты: настоящие чекбоксы, без рамок и заливок ──── */
.b-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,225px),1fr));gap:0 28px}
.b-opts.b-one{grid-template-columns:1fr}
.b-opt{display:flex;align-items:flex-start;gap:11px;padding:7px 0;cursor:pointer;
  font-size:15.5px;line-height:1.4;letter-spacing:-.004em}
.b-chk{appearance:none;-webkit-appearance:none;flex:0 0 auto;width:15px;height:15px;margin:4px 0 0;
  border:1px solid var(--c-rule-strong);background:var(--c-paper);cursor:pointer;position:relative}
.b-chk:checked{background:var(--c-ink);border-color:var(--c-ink)}
.b-chk:checked::after{content:"";position:absolute;left:4.5px;top:1px;width:4px;height:8px;
  border:solid var(--c-paper);border-width:0 1.5px 1.5px 0;transform:rotate(43deg)}
.b-chk:focus-visible{outline:2px solid var(--c-ink);outline-offset:2px}

/* ── фокус: свои контролы не наследуют стили сайта ───────── */
.b-mv button:focus-visible,.b-q textarea:focus-visible{outline:2px solid var(--c-ink);outline-offset:2px}

/* ── текст ──────────────────────────────────────────────── */
.b-q textarea{width:100%;font-family:var(--font-body);font-size:16px;line-height:1.5;color:var(--c-ink);
  background:var(--c-paper);border:1px solid var(--c-rule);padding:13px 15px;resize:vertical;
  letter-spacing:-.004em}
.b-q textarea:focus{outline:none;border-color:var(--c-ink)}
.b-q textarea::placeholder{color:var(--c-faint);font-family:var(--font-head);font-style:italic}

/* ── каркасы сайта ──────────────────────────────────────── */
.b-frames{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px}
.b-frame{border:1px solid var(--c-rule);padding:15px 17px 17px;display:flex;flex-direction:column;gap:10px;
  cursor:pointer;transition:border-color .18s ease}
.b-frame:hover{border-color:var(--c-rule-strong)}
.b-frame.is-on{border-color:var(--c-ink)}
.b-frame .b-top{display:flex;align-items:flex-start;gap:11px}
.b-frame b{font-family:var(--font-head);font-weight:400;font-size:20px;line-height:1.1}
.b-frame pre{margin:0;font-family:var(--font-mono);font-size:11.5px;line-height:1.75;
  letter-spacing:0;text-transform:none;color:var(--c-muted);white-space:pre;overflow-x:auto}
.b-frame .b-cost{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.1em;color:var(--c-faint)}

/* ── порядок ────────────────────────────────────────────── */
.b-order{border-top:1px solid var(--c-rule)}
.b-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--c-rule)}
.b-row .b-i{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.18em;color:var(--c-faint);
  flex:0 0 26px;font-variant-numeric:tabular-nums}
.b-row .b-l{flex:1;font-size:15px;line-height:1.35}
.b-mv{display:flex;gap:6px;flex:0 0 auto}
.b-mv button{cursor:pointer;width:30px;height:30px;line-height:1;background:transparent;border:0;
  color:var(--c-faint);font-size:14px;transition:color .18s}
.b-mv button:hover{color:var(--c-ink)}
.b-mv button:disabled{opacity:.22;cursor:default}

/* ── направления: целые предложения, а не токены ─────────── */
.b-dirs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,235px),1fr));gap:12px}
.b-dir{border:1px solid var(--c-rule);cursor:pointer;display:flex;flex-direction:column;
  transition:border-color .18s ease}
.b-dir:hover{border-color:var(--c-rule-strong)}
.b-dir.is-on{border-color:var(--c-ink)}
.b-dt{padding:13px 15px 15px;display:flex;align-items:flex-start;gap:11px}
.b-dt b{display:block;font-family:var(--font-head);font-weight:400;font-size:19px;line-height:1.12}
.b-dt span{display:block;margin-top:5px;font-size:13.5px;line-height:1.42;color:var(--c-muted)}
.b-dt em{display:block;margin-top:8px;font-style:normal;font-family:var(--font-mono);font-size:9.5px;
  letter-spacing:.1em;color:var(--c-faint)}
.b-dir--none{grid-column:1/-1}
.b-dir--none .b-dt b{font-size:17px}

.b-mini{--d-bg:#0D1017;--d-fg:#E9E4D6;--d-acc:#C9A24A;--d-soft:#1A2130;--d-rad:2px;
  --d-disp:'Iowan Old Style',Palatino,Georgia,serif;--d-body:'Helvetica Neue',Helvetica,Arial,sans-serif;
  background:var(--d-bg);color:var(--d-fg);font-family:var(--d-body);padding:14px;display:block}
.b-mini .b-mini-bar{font-family:var(--d-disp);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--d-acc)}
.b-mini .b-mini-cover{margin-top:11px;height:96px;border-radius:var(--d-rad);display:grid;place-items:center;
  border:1px solid color-mix(in srgb,var(--d-acc) 35%,transparent);
  background:linear-gradient(160deg,var(--d-soft),color-mix(in srgb,var(--d-acc) 22%,var(--d-soft)))}
.b-mini .b-mini-cover span{font-family:var(--d-disp);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--d-acc)}
.b-mini .b-mini-t{margin-top:11px;font-family:var(--d-disp);font-size:17px;line-height:1.1}
.b-mini .b-mini-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.b-mini .b-mini-row span:first-child{font-family:var(--d-disp);font-size:14px}
.b-mini .b-mini-cta{background:var(--d-acc);color:var(--d-bg);font-size:9.5px;font-weight:700;
  padding:7px 11px;border-radius:var(--d-rad);white-space:nowrap}

/* ── специмен ───────────────────────────────────────────── */
.b-vis{display:grid;grid-template-columns:1fr;gap:clamp(20px,3vw,40px)}
@media (min-width:1040px){.b-vis{grid-template-columns:minmax(0,1fr) 300px;align-items:start}}
/* Полоса прогресса липнет на --bar и вместе с навигацией занимает
   около 90px: специмен должен начинаться ниже неё, а не под ней. */
.b-aside{position:sticky;top:calc(var(--bar) + 96px)}
.b-aside .mono{margin-bottom:10px}
.b-mock{--p-bg:#0D1017;--p-fg:#E9E4D6;--p-acc:#C9A24A;--p-soft:#1A2130;
  --p-rad:2px;--p-pad:18px;--p-disp:'Iowan Old Style',Palatino,Georgia,serif;
  --p-body:'Helvetica Neue',Helvetica,Arial,sans-serif;
  background:var(--p-bg);color:var(--p-fg);padding:var(--p-pad);font-family:var(--p-body);
  /* Светлое направление на белой странице иначе растворяется. */
  border:1px solid var(--c-rule);transition:background .25s,color .25s}
.b-mock .b-mbar{display:flex;justify-content:space-between;align-items:center;font-size:9px;
  letter-spacing:.2em;text-transform:uppercase;opacity:.72}
.b-mock .b-mbar b{font-family:var(--p-disp);font-size:12px;letter-spacing:.12em;color:var(--p-acc);opacity:1;font-weight:400}
.b-mock .b-cover{margin-top:calc(var(--p-pad) * .8);aspect-ratio:3/4;border-radius:var(--p-rad);
  display:grid;place-items:center;border:1px solid color-mix(in srgb,var(--p-acc) 35%,transparent);
  background:linear-gradient(160deg,var(--p-soft),color-mix(in srgb,var(--p-acc) 22%,var(--p-soft)))}
.b-mock .b-cover span{font-family:var(--p-disp);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--p-acc)}
.b-mock h4{font-family:var(--p-disp);font-size:24px;line-height:1.08;margin-top:calc(var(--p-pad) * .8)}
.b-mock p{margin-top:6px;font-size:11.5px;line-height:1.5;opacity:.72}
.b-mock .b-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:calc(var(--p-pad) * .6)}
.b-mock .b-tags i{font-style:normal;font-size:9px;padding:3px 8px;border-radius:99px;opacity:.75;
  border:1px solid color-mix(in srgb,var(--p-fg) 25%,transparent)}
.b-mock .b-prow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:calc(var(--p-pad) * .7)}
.b-mock .b-price{font-family:var(--p-disp);font-size:19px}
.b-mock .b-cta{background:var(--p-acc);color:var(--p-bg);font-size:11px;font-weight:700;
  padding:9px 14px;border-radius:var(--p-rad);white-space:nowrap}
.b-aside p.b-note{margin-top:12px;font-size:13px;line-height:1.45;color:var(--c-faint)}

/* ── финал ──────────────────────────────────────────────── */
.b-fin{background:var(--c-ink);color:var(--c-paper);padding:clamp(26px,4vw,48px);
  margin-top:clamp(2.4rem,5vw,4.4rem)}
.b-fin h2{font-family:var(--font-display);font-size:clamp(28px,3.4vw,46px);line-height:.98;letter-spacing:-.04em}
.b-fin .mono{color:rgba(255,255,255,.55)}
.b-fin p{margin-top:16px;max-width:52ch;color:rgba(255,255,255,.76);font-size:16px}
.b-acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
.b-fin .btn{border-color:rgba(255,255,255,.4);color:var(--c-paper)}
.b-fin .btn:hover{background:var(--c-paper);border-color:var(--c-paper);color:var(--c-ink)}
.b-fin .btn--solid{background:var(--c-paper);border-color:var(--c-paper);color:var(--c-ink)}
.b-fin .btn--solid:hover{background:#e6e4e0;border-color:#e6e4e0;color:var(--c-ink)}
.b-said{margin-top:18px;font-size:15px;line-height:1.5;color:rgba(255,255,255,.9);max-width:52ch}
.b-out{margin-top:18px;white-space:pre-wrap;font-family:var(--font-mono);font-size:12px;line-height:1.7;
  letter-spacing:0;text-transform:none;color:rgba(255,255,255,.82);background:#1d1d1d;
  border:1px solid rgba(255,255,255,.18);padding:16px 18px;max-height:360px;overflow:auto}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms !important}}
@media print{.b-bar,.b-acts,.site-head,.b-mv{display:none}.b-fin{background:#fff;color:#000}
  .b-fin h2,.b-fin p{color:#000}.b-q{break-inside:avoid}}
</style>
</head>

  "use strict";

  var DIRECTIONS = [
    {id:"d1", nm:"Ніч і латунь",

     cost:"без ілюстрацій · залежить від сильних текстів",
     bg:"#17161A", fg:"#EDE7E1", acc:"#B4402F", soft:"#241F21", rad:0, pad:18,

  function dirByName(nm){
    for(var i = 0; i < DIRECTIONS.length; i++){ if(DIRECTIONS[i].nm === nm) return DIRECTIONS[i]; }
    return null;
  }

  var FRAMES = [
    {nm:"Лендінг однієї книги",
     tree:"/\n├─ перший екран: обкладинка\n├─ про книгу: анотація, фрагмент\n├─ про автора\n├─ характеристики, ціна\n├─ форма замовлення\n└─ підвал: контакти, доставка",

      {id:"integrations", type:"multi", q:"Інтеграції, які треба підключити",

  var KEY = "vidmar-brief-v4";
  var A = {};
  try { var raw = localStorage.getItem(KEY); if(raw) A = JSON.parse(raw) || {}; } catch(e){ A = {}; }

  var savedEl = document.getElementById("saved");
  var saveTimer = null;
  function save(){
    try{
      localStorage.setItem(KEY, JSON.stringify(A));
      savedEl.textContent = "збережено";
      clearTimeout(saveTimer);
      saveTimer = setTimeout(function(){ savedEl.textContent = ""; }, 1700);
    }catch(e){
      savedEl.textContent = "збереження недоступне";
    }
  }

  var ALL = [];
  SECTIONS.forEach(function(s){ s.qs.forEach(function(q){ ALL.push(q); }); });

  function arrOf(id){
    if(!Array.isArray(A[id])) A[id] = (A[id] === undefined || A[id] === null) ? [] : [A[id]];
    return A[id];
  }
  function pair(id){
    if(!A[id] || typeof A[id] !== "object" || Array.isArray(A[id])) A[id] = {l:[], t:""};
    if(!Array.isArray(A[id].l)) A[id].l = [];
    if(typeof A[id].t !== "string") A[id].t = "";
    return A[id];
  }
  function toggle(arr, value){
    var i = arr.indexOf(value);
    if(i > -1) arr.splice(i, 1); else arr.push(value);
  }

  function answered(q){
    var v = A[q.id];
    if(v === undefined || v === null) return false;
    if(q.type === "multi" || q.type === "frames" || q.type === "direction") return Array.isArray(v) && v.length > 0;
    if(q.type === "multitext") return (Array.isArray(v.l) && v.l.length > 0) || (typeof v.t === "string" && v.t.trim().length > 0);
    if(q.type === "text") return String(v).trim().length > 0;
    // Порядок по умолчанию — это ещё не ответ: пока список не двигали,
    // вопрос не заполнен, иначе счётчик показывает работу, которой не было.
    if(q.type === "order") return v.join("|") !== q.items.join("|");
    return true;
  }
  function updateProgress(){
    var n = 0;
    ALL.forEach(function(q){ if(answered(q)) n++; });
    var pct = Math.round(n / ALL.length * 100);
    document.getElementById("fill").style.width = pct + "%";
    document.getElementById("track").setAttribute("aria-valuenow", String(pct));
    var c = document.getElementById("count");
    c.textContent = "";
    var strong = document.createElement("b");
    strong.textContent = String(n);
    c.appendChild(strong);
    c.appendChild(document.createTextNode(" / " + ALL.length));
  }

  function el(tag, cls, txt){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(txt !== undefined) e.textContent = txt;
    return e;
  }
  function checkbox(){
    var c = document.createElement("input");
    c.type = "checkbox";
    c.className = "b-chk";
    return c;
  }
  function repaintAll(box){
    Array.prototype.forEach.call(box.children, function(ch){ ch.dispatchEvent(new Event("repaint")); });
  }

  var NONE = "Жоден із чотирьох не підходить";

  var mock = null;
  function syncMock(){
    if(!mock) return;
    var chosen = Array.isArray(A.direction) ? A.direction : [];
    var picked = null;
    for(var i = 0; i < chosen.length && !picked; i++){ if(chosen[i] !== NONE) picked = dirByName(chosen[i]); }
    var d = picked || DIRECTIONS[0];
    mock.style.setProperty("--p-bg", d.bg);
    mock.style.setProperty("--p-fg", d.fg);
    mock.style.setProperty("--p-acc", d.acc);
    mock.style.setProperty("--p-soft", d.soft);
    mock.style.setProperty("--p-disp", d.disp);
    mock.style.setProperty("--p-body", d.body);
    mock.style.setProperty("--p-rad", d.rad + "px");
    mock.style.setProperty("--p-pad", d.pad + "px");
    var cap = document.getElementById("specName");
    if(cap){
      if(picked) cap.textContent = d.nm;
      else if(chosen.indexOf(NONE) > -1) cap.textContent = "жоден не підходить — покажемо інше";
      else cap.textContent = d.nm + " · поки не вибрано";
    }
  }

  function renderQ(q, num){
    var card = el("article", "b-q");
    card.id = "q-" + q.id;

    var ask = el("div", "b-ask");
    var nu = el("p", "b-num mono");
    nu.appendChild(el("i"));
    nu.appendChild(document.createTextNode(String(num).padStart(2, "0")));
    ask.appendChild(nu);
    var title = el("h3", null, q.q);
    title.id = "qt-" + q.id;
    ask.appendChild(title);
    if(q.hint) ask.appendChild(el("p", "b-hint", q.hint));
    if(q.ex) ask.appendChild(el("p", "b-ex", q.ex));
    card.appendChild(ask);

    var body = el("div", "b-answer");
    card.appendChild(body);

    function mark(){
      card.classList.toggle("is-done", answered(q));
      updateProgress();
      save();
    }

    if(q.type === "multi" || q.type === "multitext"){
      var arr = q.type === "multi" ? arrOf(q.id) : pair(q.id).l;
      var longest = 0;
      q.opts.forEach(function(o){ longest = Math.max(longest, o.length); });
      var box = el("div", "b-opts" + (longest > 40 ? " b-one" : ""));
      box.setAttribute("role", "group");
      box.setAttribute("aria-labelledby", "qt-" + q.id);
      q.opts.forEach(function(o){
        var lab = el("label", "b-opt");
        var c = checkbox();
        c.checked = arr.indexOf(o) > -1;
        lab.appendChild(c);
        lab.appendChild(el("span", null, o));
        c.addEventListener("change", function(){
          toggle(arr, o);
          mark();
        });
        box.appendChild(lab);
      });
      body.appendChild(box);

      if(q.type === "multitext"){
        var extra = document.createElement("textarea");
        extra.rows = (q.ph && q.ph.split("\n").length > 3) ? 5 : 3;
        extra.id = "in-" + q.id;
        extra.placeholder = q.ph || "";
        extra.setAttribute("aria-label", q.q + " — деталі");
        extra.value = pair(q.id).t;
        extra.style.marginTop = "14px";
        extra.addEventListener("input", function(){ pair(q.id).t = extra.value; mark(); });
        body.appendChild(extra);
      }
    }

    if(q.type === "text"){
      var ta = document.createElement("textarea");
      ta.rows = (q.ph && q.ph.split("\n").length > 3) ? 6 : 4;
      ta.id = "in-" + q.id;
      ta.placeholder = q.ph || "";
      ta.setAttribute("aria-label", q.q);
      ta.value = A[q.id] || "";
      ta.addEventListener("input", function(){ A[q.id] = ta.value; mark(); });
      body.appendChild(ta);
    }

    if(q.type === "direction"){
      var dg = el("div", "b-dirs");
      dg.setAttribute("role", "group");
      dg.setAttribute("aria-labelledby", "qt-" + q.id);

      function dirCard(label, note, mini){
        var lab = el("label", "b-dir" + (mini ? "" : " b-dir--none"));
        if(mini) lab.appendChild(mini);
        var t = el("div", "b-dt");
        var c = checkbox();
        t.appendChild(c);
        var txt = el("div");
        txt.appendChild(el("b", null, label));
        if(note) txt.appendChild(el("span", null, note));
        t.appendChild(txt);
        lab.appendChild(t);
        lab.chk = c;
        lab.txt = txt;
        return lab;
      }

      var cards = [];
      DIRECTIONS.forEach(function(d){
        var mini = el("div", "b-mini");
        mini.style.setProperty("--d-bg", d.bg);
        mini.style.setProperty("--d-fg", d.fg);
        mini.style.setProperty("--d-acc", d.acc);
        mini.style.setProperty("--d-soft", d.soft);
        mini.style.setProperty("--d-rad", d.rad + "px");
        mini.style.setProperty("--d-disp", d.disp);
        mini.style.setProperty("--d-body", d.body);
        mini.innerHTML =
          '<div class="b-mini-bar">ВІДЬМАР</div>' +
          '<div class="b-mini-cover"><span>Обкладинка</span></div>' +
          '<div class="b-mini-t">Херсонський знатник</div>' +
          '<div class="b-mini-row"><span>540 ₴</span><span class="b-mini-cta">Забрати книгу</span></div>';
        var card = dirCard(d.nm, d.ds, mini);
        card.txt.appendChild(el("em", null, d.cost));
        card.value = d.nm;
        cards.push(card);
        dg.appendChild(card);
      });

      // Отказ — тоже ответ, и он обнуляет остальные отметки.
      var noneCard = dirCard(NONE, "Готуємо другий показ.", null);
      noneCard.value = NONE;
      cards.push(noneCard);
      dg.appendChild(noneCard);

      function paintDirs(){
        var picked = arrOf("direction");
        cards.forEach(function(card){
          var on = picked.indexOf(card.value) > -1;
          card.chk.checked = on;
          card.classList.toggle("is-on", on);
        });
      }
      paintDirs();
      cards.forEach(function(card){
        card.chk.addEventListener("change", function(){
          var picked = arrOf("direction");
          if(card.value === NONE){
            A.direction = card.chk.checked ? [NONE] : [];
          } else {
            var i = picked.indexOf(NONE);
            if(i > -1) picked.splice(i, 1);
            toggle(picked, card.value);
          }
          paintDirs(); syncMock(); mark();
        });
      });

      body.appendChild(dg);
    }

    if(q.type === "frames"){
      var fg = el("div", "b-frames");
      fg.setAttribute("role", "group");
      fg.setAttribute("aria-labelledby", "qt-" + q.id);
      var fcards = [];
      FRAMES.forEach(function(fr){
        var lab = el("label", "b-frame");
        var top = el("div", "b-top");
        var c = checkbox();
        top.appendChild(c);
        top.appendChild(el("b", null, fr.nm));
        lab.appendChild(top);
        lab.appendChild(el("pre", null, fr.tree));
        lab.appendChild(el("div", "b-cost", fr.cost));
        lab.chk = c; lab.value = fr.nm;
        fcards.push(lab);
        fg.appendChild(lab);
      });
      function paintFrames(){
        var picked = arrOf("frame");
        fcards.forEach(function(card){
          var on = picked.indexOf(card.value) > -1;
          card.chk.checked = on;
          card.classList.toggle("is-on", on);
        });
      }
      paintFrames();
      fcards.forEach(function(card){
        card.chk.addEventListener("change", function(){
          toggle(arrOf("frame"), card.value);
          paintFrames(); mark();
        });
      });
      body.appendChild(fg);
    }

    if(q.type === "order"){
      if(!Array.isArray(A[q.id])) A[q.id] = q.items.slice();
      var list = el("div", "b-order");
      function draw(){
        list.innerHTML = "";
        A[q.id].forEach(function(item, i){
          var r = el("div", "b-row");
          r.appendChild(el("span", "b-i", String(i + 1).padStart(2, "0")));
          r.appendChild(el("span", "b-l", item));
          var mv = el("div", "b-mv");
          var up = el("button", null, "↑"); up.type = "button"; up.setAttribute("aria-label", "Підняти: " + item);
          var dn = el("button", null, "↓"); dn.type = "button"; dn.setAttribute("aria-label", "Опустити: " + item);
          if(i === 0) up.disabled = true;
          if(i === A[q.id].length - 1) dn.disabled = true;
          up.addEventListener("click", function(){ var a = A[q.id], t = a[i - 1]; a[i - 1] = a[i]; a[i] = t; draw(); mark(); });
          dn.addEventListener("click", function(){ var a = A[q.id], t = a[i + 1]; a[i + 1] = a[i]; a[i] = t; draw(); mark(); });
          mv.appendChild(up); mv.appendChild(dn);
          r.appendChild(mv);
          list.appendChild(r);
        });
      }
      draw();
      body.appendChild(list);
    }

    card.classList.toggle("is-done", answered(q));
    return card;
  }

  var form = document.getElementById("form");
  var n = 0;
  SECTIONS.forEach(function(s){
    var sec = el("section", "b-sec");
    sec.id = s.id;
    var head = el("div", "b-sec-head");
    head.appendChild(el("h2", null, s.title));
    sec.appendChild(head);

    var list = el("div", "b-qs");
    s.qs.forEach(function(q){ n++; list.appendChild(renderQ(q, n)); });

    if(s.vis){
      var lay = el("div", "b-vis");
      lay.appendChild(list);
      var aside = el("aside", "b-aside");
      var cap = el("p", "mono");

      var capName = el("span"); capName.id = "specName";
      cap.appendChild(capName);
      aside.appendChild(cap);
      mock = el("div", "b-mock");
      mock.innerHTML =
        '<div class="b-mbar"><b>ВІДЬМАР</b><span>каталог</span></div>' +
        '<div class="b-cover"><span>Обкладинка</span></div>' +
        '<h4>Херсонський знатник</h4>' +
        '<p>Українське чаклунство, знахарство та міф — зібране з польових записів і власної практики.</p>' +
        '<div class="b-tags"><i>езотерика</i><i>міф</i><i>нон-фікшн</i></div>' +
        '<div class="b-prow"><span class="b-price">540 ₴</span><span class="b-cta">До кошика</span></div>';
      aside.appendChild(mock);
      aside.appendChild(el("p", "b-note", "Пропозиція, не фінальний дизайн."));
      lay.appendChild(aside);
      sec.appendChild(lay);
    } else {
      sec.appendChild(list);
    }

    form.appendChild(sec);
  });

  syncMock();
  updateProgress();
  savedEl.textContent = "";

  function buildText(){
    var L = [];
    L.push("БРИФ НА САЙТ — ВІДЬМАР");
    L.push("Заповнено: " + new Date().toLocaleDateString("uk-UA", {day:"numeric", month:"long", year:"numeric"}));
    L.push("Джерело: munister.com.ua/brief/vidmar/");
    L.push("");
    var i = 0;
    SECTIONS.forEach(function(s){
      L.push("=== " + s.title.toUpperCase() + " ===");
      s.qs.forEach(function(q){
        i++;
        var v = A[q.id], out;
        if(q.type === "multi" || q.type === "frames") out = (Array.isArray(v) && v.length) ? v.join(", ") : "—";
        else if(q.type === "multitext"){
          var parts = [];
          if(v && Array.isArray(v.l) && v.l.length) parts.push(v.l.join(", "));
          if(v && v.t && v.t.trim()) parts.push(v.t.trim().split("\n").join("\n    "));
          out = parts.length ? parts.join("\n    ") : "—";
        }
        else if(q.type === "order") out = (v || q.items).map(function(x, k){ return "\n    " + (k + 1) + ") " + x; }).join("");
        else if(q.type === "direction"){
          var picks = Array.isArray(v) ? v : [];
          if(!picks.length) out = "—";
          else out = picks.map(function(nm){
            var d = dirByName(nm);
            return d ? (d.nm + " (" + d.bg + " / " + d.acc + " / " + d.fg + ") — " + d.cost) : nm + " — потрібен другий показ";
          }).join("\n    ");
        }
        else if(q.type === "text") out = (v && String(v).trim()) ? String(v).trim().split("\n").join("\n    ") : "—";
        else out = (v && String(v).trim()) ? String(v).trim() : "—";
        L.push(String(i).padStart(2, "0") + ". " + q.q);
        L.push("    " + out);
      });
      L.push("");
    });
    var done = 0;
    ALL.forEach(function(q){ if(answered(q)) done++; });
    L.push("Заповнено питань: " + done + " з " + ALL.length);
    return L.join("\n");
  }

  /* Ответ уходит в EPRIS Forms API — туда же, куда анкеты авторов журнала,
     и оттуда же приходит уведомление в телеграм. Публичный маршрут: анкета
     открыта по ссылке, ответы наружу сервис не отдаёт никогда. */
  var ENDPOINT = "https://api.eprisjournal.com/forms/public/vidmar/submit";

  function payload(){
    var answers = {};
    SECTIONS.forEach(function(sec){
      sec.qs.forEach(function(q){
        var v = A[q.id];
        if(q.type === "multi" || q.type === "frames" || q.type === "direction"){
          answers[q.id] = Array.isArray(v) ? v : [];
        } else if(q.type === "multitext"){
          var box = (v && typeof v === "object") ? v : {l:[], t:""};
          answers[q.id] = Array.isArray(box.l) ? box.l : [];
          answers[q.id + "_note"] = box.t || "";
        } else if(q.type === "order"){
          var order = Array.isArray(v) ? v : q.items;
          answers[q.id] = order.map(function(item, i){ return (i + 1) + ". " + item; }).join("\n");
        } else {
          answers[q.id] = v || "";
        }
      });
    });
    return { website: "", answers: answers };
  }

  var out = document.getElementById("out");
  var said = document.getElementById("said");
  var sendBtn = document.getElementById("send");

  function say(text){ said.textContent = text; said.hidden = false; }

  sendBtn.addEventListener("click", function(){
    var answered = 0;
    ALL.forEach(function(q){ if(A[q.id] !== undefined) answered++; });
    sendBtn.disabled = true;
    sendBtn.textContent = "Надсилаємо…";
    out.hidden = true;
    said.hidden = true;

    fetch(ENDPOINT, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(payload())
    }).then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(data){ return {ok: r.ok, data: data}; });
    }).then(function(res){
      if(res.ok && res.data && res.data.ok){
        sendBtn.textContent = "Надіслано";
        say(res.data.thankYou || "Дякуємо, бриф у нас.");
        try{ localStorage.removeItem(KEY); }catch(e){}
        return;
      }
      throw new Error((res.data && res.data.error) || "не вийшло");
    }).catch(function(){
      // Отправка может не дойти — тогда ответы не должны пропасть вместе с ней.
      sendBtn.disabled = false;
      sendBtn.textContent = "Спробувати ще раз";
      say("Не вийшло надіслати. Скопіюйте текст нижче й надішліть нам у будь-який месенджер.");
      out.textContent = buildText();
      out.hidden = false;
      if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(out.textContent).catch(function(){});
    });
  });

  document.getElementById("reset").addEventListener("click", function(){
    if(!confirm("Очистити всі відповіді? Дію не можна скасувати.")) return;
    try{ localStorage.removeItem(KEY); }catch(e){}
    location.reload();
  });

  document.getElementById("y").textContent = new Date().getFullYear();

  // Шапка сайта и полоса прогресса обе липкие, а высота полосы зависит от
  // ширины экрана. Считаем отступ для якорей по факту, а не на глаз.
  var bar = document.querySelector(".b-bar");
  function syncAnchorOffset(){
    var h = bar ? bar.getBoundingClientRect().height : 0;
    var top = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--bar")) || 56;
    document.documentElement.style.scrollPaddingTop = Math.round(top + h + 12) + "px";
  }
  syncAnchorOffset();
  window.addEventListener("resize", syncAnchorOffset);
})();
</script>
